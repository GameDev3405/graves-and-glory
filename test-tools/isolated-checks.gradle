allprojects {
 afterEvaluate {
  def isolatedRoot = System.getenv('GRAVES_ROADMAP_TEST_ROOT')
  if (!isolatedRoot) throw new GradleException('GRAVES_ROADMAP_TEST_ROOT is required')
  project.extensions.getByName('loom').runs.getByName('client').runDir = project.relativePath(file(isolatedRoot + '/run'))
  tasks.matching { it.name == 'runClient' }.configureEach {
   def testRoot = System.getenv('GRAVES_ROADMAP_TEST_ROOT')
   if (!testRoot) throw new GradleException('GRAVES_ROADMAP_TEST_ROOT is required')
   workingDir file(testRoot + '/run')
   jvmArgs = jvmArgs.findAll { !it.startsWith('-Dgravesandglory.localChecks=') && !it.startsWith('-Dgravesandglory.runtime=') }
   systemProperty 'gravesandglory.localChecks', testRoot + '/evidence/local-checks.txt'
   systemProperty 'gravesandglory.runtime', testRoot + '/runtime'
   systemProperty 'gravesandglory.migrationFixture', System.getenv('GRAVES_ROADMAP_MIGRATION') ?: 'false'
   systemProperty 'gravesandglory.startupOnly', System.getenv('GRAVES_ROADMAP_STARTUP_ONLY') ?: 'false'
   systemProperty 'gravesandglory.compatibilityCase', System.getenv('GRAVES_ROADMAP_COMPAT_CASE') ?: ''
   systemProperty 'gravesandglory.networkHost', System.getenv('GRAVES_NETWORK_HOST') ?: 'false'
   systemProperty 'gravesandglory.networkRoot', System.getenv('GRAVES_NETWORK_ROOT') ?: testRoot
   systemProperty 'gravesandglory.campChecks', System.getenv('GRAVES_CAMP_CHECKS') ?: 'false'
   systemProperty 'gravesandglory.frontChecks', System.getenv('GRAVES_ROADMAP_FRONT_CHECKS') ?: 'false'
   systemProperty 'gravesandglory.frontHost', System.getenv('GRAVES_ROADMAP_FRONT_HOST') ?: 'false'
   systemProperty 'gravesandglory.phase3Checks', System.getenv('GRAVES_PHASE3_CHECKS') ?: ''
   systemProperty 'gravesandglory.phase3Maps', System.getenv('GRAVES_PHASE3_MAPS') ?: '0,1,2,3,4'
   systemProperty 'gravesandglory.studioPieces', System.getenv('GRAVES_STUDIO_PIECES') ?: ''
   systemProperty 'gravesandglory.studioMode', System.getenv('GRAVES_STUDIO_MODE') ?: 'verify'
   systemProperty 'gravesandglory.studioOut', System.getenv('GRAVES_STUDIO_OUT') ?: testRoot + '/studio-out'
   systemProperty 'gravesandglory.phase1Checks', System.getenv('GRAVES_PHASE1_CHECKS') ?: ''
   systemProperty 'gravesandglory.phase2Checks', System.getenv('GRAVES_PHASE2_CHECKS') ?: ''
   systemProperty 'gravesandglory.fadeRed', System.getenv('GRAVES_FADE_RED') ?: 'false'
   systemProperty 'gravesandglory.turnTroops', System.getenv('GRAVES_PHASE2_TURN') ?: 'gilded'
   systemProperty 'gravesandglory.turnStage', System.getenv('GRAVES_PHASE2_STAGE') ?: '1'
   systemProperty 'gravesandglory.turnWeapon', System.getenv('GRAVES_PHASE2_WEAPON') ?: '1'
   systemProperty 'gravesandglory.faceTroops', System.getenv('GRAVES_PHASE2_FACES') ?: ''
   systemProperty 'gravesandglory.faceForce', System.getenv('GRAVES_PHASE2_FACE') ?: '-1'
   systemProperty 'gravesandglory.motionBaseline', System.getenv('GRAVES_MOTION_BASELINE') ?: ''
  }
 }
}
