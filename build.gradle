plugins { id 'fabric-loom' version '1.17.21' }
version = project.property('mod_version')
group = 'gg.gravesandglory'
base { archivesName = 'graves-and-glory' }
repositories {
 mavenCentral()
 // GeckoLib (approved by Kort for the unit animation rebuild).
 maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
 // Polymer (plain clients, port plan P3; Kort approved Polymer 0.9.19+1.21.1 for the plain-client work): its official Maven, nothing else from it.
 maven { url = 'https://maven.nucleoid.xyz/'; content { includeGroup 'eu.pb4'; includeGroup 'xyz.nucleoid' } }
}
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.19.5'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.18+1.21.1'
 modImplementation 'software.bernie.geckolib:geckolib-fabric-1.21.1:4.9.3'
 include 'software.bernie.geckolib:geckolib-fabric-1.21.1:4.9.3'
 // Plain clients (port plan P3): Polymer is a server-only, optional runtime dependency. Compile against it, never include it: a modpack
 // client runs without it (gravesandglory.polymer.mixins.json applies only when polymer-core is loaded, and PolymerBridge loads only then).
 modCompileOnly('eu.pb4:polymer-core:0.9.19+1.21.1') { exclude group: 'net.fabricmc.fabric-api' }
 modCompileOnly('eu.pb4:polymer-resource-pack:0.9.19+1.21.1') { exclude group: 'net.fabricmc.fabric-api' }
 // -PplainClients puts Polymer on this Gradle run's classpath (use it for runServer only; a dev client without it is the release modpack).
 if (project.hasProperty('plainClients')) {
  modLocalRuntime('eu.pb4:polymer-core:0.9.19+1.21.1') { exclude group: 'net.fabricmc.fabric-api' }
  modLocalRuntime('eu.pb4:polymer-resource-pack:0.9.19+1.21.1') { exclude group: 'net.fabricmc.fabric-api' }
 }
}
loom { runs { client { programArgs '--width', '1280', '--height', '720' } } }
// Dedicated server test: its own run folder, so client logs and options stay untouched.
loom { runs { server { runDir 'run-server'; programArgs '--nogui' } } }
tasks.register('compileLocalTestTools', JavaCompile) {
 source = fileTree('test-tools/java')
 classpath = sourceSets.main.compileClasspath + sourceSets.main.output
 dependsOn compileJava
 destinationDirectory = file('build/localTestTools/classes')
 options.release = 21
}
tasks.register('localTestToolsJar', Jar) {
 dependsOn compileLocalTestTools
 from('build/localTestTools/classes')
 from('test-tools/resources')
 archiveFileName = 'local-integration-DO-NOT-SHIP.jar'
 destinationDirectory = file('build/localTestTools')
}
if (project.hasProperty('localIntegration') || project.hasProperty('mapTour') || project.hasProperty('mapWalk') || project.hasProperty('mapForge') || project.hasProperty('campaignChecks') || project.hasProperty('selfTest')) {
 loom.runs.client.vmArg '-Dgravesandglory.localIntegration=true'
 loom.runs.client.vmArg "-Dfabric.addMods=${file('build/localTestTools/local-integration-DO-NOT-SHIP.jar').absolutePath}"
 tasks.named('runClient') { dependsOn localTestToolsJar }
}
// Battle self-test: pathing, capture, combat, capacity, bridges, hills, friendly fire and barracks.
if (project.hasProperty('selfTest')) {
 loom.runs.client.vmArg '-Dgravesandglory.selfTest=true'
 loom.runs.client.vmArg "-Dgravesandglory.localChecks=${file('evidence/self-test.txt').absolutePath}"
}
// Bot-vs-bot simulation on the dedicated server (test-tools/java/gg/gravesandglory/BotSimulation.java):
// -PbotSim=<matches> [-PsimDawn=<tier> -PsimDusk=<tier> -PsimMaps=0,1,2 -PsimSize=3 -PsimRoundSeconds=300 -PsimKit=native|gilded|graveborn -PsimBanner0=<botBanners id> -PsimBanner1=<botBanners id> -PsimProgression=on|off -PsimFast=true -PsimOverride=<sheet.row.column=value;...> -PsimMode=domination|siege|convoy -PsimSeed=<n> (test only: independent samples) -PsimNoLeash=true (test only: camp leash off, for spectators)]; results in <server root>/botsim/.
if (project.hasProperty('botSim')) {
 loom.runs.server.vmArg '-Dgravesandglory.localIntegration=true'
 loom.runs.server.vmArg "-Dfabric.addMods=${file('build/localTestTools/local-integration-DO-NOT-SHIP.jar').absolutePath}"
 // The test tools' checks probe would otherwise append to the file a Melty test descriptor names; keep its lines in the server root.
 loom.runs.server.vmArg '-Dgravesandglory.localChecks=local-checks.txt'
 loom.runs.server.vmArg "-Dgravesandglory.botSim=${project.property('botSim')}"
 ['simDawn', 'simDusk', 'simMaps', 'simSize', 'simRoundSeconds', 'simKit', 'simBanner0', 'simBanner1', 'simProgression', 'simFast', 'simOverride', 'simMode', 'simOverlayCheck', 'simGoto', 'simSeed', 'simPlan', 'simOrder', 'simNoLeash'].each { name ->
  if (project.hasProperty(name)) loom.runs.server.vmArg "-Dgravesandglory.${name}=${project.property(name)}"
 }
 tasks.named('runServer') { dependsOn localTestToolsJar }
}
// Balance method duels (test-tools/java/gg/gravesandglory/DuelSimulation.java): small fights with no points, one at a time in an open cell.
// -PduelSim=<plan file> [-PduelMap=0 -PduelShard=<i>/<n> -PduelSeed=<n> -PsimFast=true -PsimOverride=<sheet.row.column=value;...>]; results in <server root>/duel/.
if (project.hasProperty('duelSim')) {
 loom.runs.server.vmArg '-Dgravesandglory.localIntegration=true'
 loom.runs.server.vmArg "-Dfabric.addMods=${file('build/localTestTools/local-integration-DO-NOT-SHIP.jar').absolutePath}"
 loom.runs.server.vmArg '-Dgravesandglory.localChecks=local-checks.txt'
 loom.runs.server.vmArg "-Dgravesandglory.duelSim=${project.property('duelSim')}"
 ['duelMap', 'duelShard', 'duelSeed', 'simFast', 'simOverride', 'scratchNoHurtCooldown', 'scratchTroopBypassArmor'].each { name ->
  if (project.hasProperty(name)) loom.runs.server.vmArg "-Dgravesandglory.${name}=${project.property(name)}"
 }
 tasks.named('runServer') { dependsOn localTestToolsJar }
}
// Dedicated-server payload exchange (test-tools/java/gg/gravesandglory/NetExchangeProbe.java and NetExchangeChecks.java, port plan P1.3): -PnetExchange=<shared dir> loads the
// test tools on the server, counts every gravesandglory payload it sends and receives and lets the client end the round and stop the server (SliceProbe
// on the same dir). -PloginGate=false switches the 1.20.1 login fallback of VersionGate off for the gate cases; it changes no rule.
if (project.hasProperty('netExchange')) {
 loom.runs.server.vmArg '-Dgravesandglory.localIntegration=true'
 loom.runs.server.vmArg "-Dfabric.addMods=${file('build/localTestTools/local-integration-DO-NOT-SHIP.jar').absolutePath}"
 loom.runs.server.vmArg '-Dgravesandglory.localChecks=local-checks.txt'
 loom.runs.server.vmArg "-Dgravesandglory.netExchange=${project.property('netExchange')}"
 loom.runs.server.vmArg "-Dgravesandglory.sliceDir=${project.property('netExchange')}"
 if (project.hasProperty('loginGate')) loom.runs.server.vmArg "-Dgravesandglory.loginGate=${project.property('loginGate')}"
 tasks.named('runServer') { dependsOn localTestToolsJar }
}
// Reward driver (test-tools/java/gg/gravesandglory/RewardDriver.java, QA row K7): -PrewardDriver=<control dir> lets a script move a dedicated server round's clock back and call the real finish; it changes no rule.
if (project.hasProperty('rewardDriver')) {
 loom.runs.server.vmArg '-Dgravesandglory.localIntegration=true'
 loom.runs.server.vmArg "-Dfabric.addMods=${file('build/localTestTools/local-integration-DO-NOT-SHIP.jar').absolutePath}"
 loom.runs.server.vmArg '-Dgravesandglory.localChecks=local-checks.txt'
 loom.runs.server.vmArg "-Dgravesandglory.rewardDriver=${project.property('rewardDriver')}"
 tasks.named('runServer') { dependsOn localTestToolsJar }
}
if (project.hasProperty('visualInspection')) { loom.runs.client.vmArg '-Dgravesandglory.visualInspection=true' }
tasks.register('preflight', Exec) { commandLine 'python', 'tools/preflight.py' }
compileJava.dependsOn preflight

// Reject stale release JARs by embedding the identity of their build inputs.
def releaseResources = layout.buildDirectory.dir('generated/release-resources')
tasks.register('generateReleaseIdentity', Exec) {
 dependsOn preflight
 inputs.dir('src/main')
 inputs.files('build.gradle', 'gradle.properties', 'settings.gradle',
              'sheets/design.json', 'tools/package.py', 'tools/release_config.py',
              'tools/build_identity.py')
 outputs.file(releaseResources.map { it.file('gravesandglory-build.json') })
 commandLine 'python', 'tools/build_identity.py', releaseResources.get().file('gravesandglory-build.json').asFile
}
sourceSets.main.resources.srcDir releaseResources
// Read at configuration time: Gradle 9 deprecates Task.project inside an execution-time closure.
def modVersion = project.version
processResources {
 dependsOn generateReleaseIdentity
 inputs.property('version', modVersion)
 filesMatching('fabric.mod.json') { expand(version: modVersion) }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.compilerArgs += ['-Xmaxerrs', '10000'] }
// Port aid: -PallErrors makes javac go on through flow analysis, so errors hidden behind attribution errors show too.
if (project.hasProperty('allErrors')) tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-XDshould-stop.ifError=FLOW'] }
java { withSourcesJar() }
tasks.named('sourcesJar') { dependsOn generateReleaseIdentity }
tasks.named('jar') { from('LICENSE') }

if (project.hasProperty('commandPlaytest')) { loom.runs.client.vmArg '-Dgravesandglory.commandPlaytest=true' }

if (project.hasProperty("campaignChecks")) { loom.runs.client.vmArg "-Dgravesandglory.localChecks=${file("evidence/local-checks.txt").absolutePath}" }

// Map photographs: every map's spawns, objectives and overview (test-tools/MapTour.java).
if (project.hasProperty('mapTour')) {
 loom.runs.client.vmArg '-Dgravesandglory.mapTour=true'
 loom.runs.client.vmArg "-Dgravesandglory.tourTag=${project.findProperty('tourTag') ?: 'now'}"
 loom.runs.client.vmArg "-Dgravesandglory.tourMaps=${project.findProperty('tourMaps') ?: '0,1,2,3,4'}"
}

// Map Forge walkthrough: an exported surface in a flat test world, photographed from a plan of cameras (test-tools/MapWalk.java).
if (project.hasProperty('mapWalk')) {
 loom.runs.client.vmArg '-Dgravesandglory.mapWalk=true'
 loom.runs.client.vmArg "-Dgravesandglory.walkTag=${project.findProperty('walkTag') ?: 'now'}"
 loom.runs.client.vmArg "-Dgravesandglory.walkFile=${project.findProperty('walkFile')}"
 loom.runs.client.vmArg "-Dgravesandglory.walkPlan=${project.findProperty('walkPlan')}"
}

// Map adoption runs (test-tools/MapForgeHarness.java): -PmapForge=<script> hosts a world and drives /mapforge from the script; -PadoptionDev loads the
// unshipped dev overlays (test-tools/resources/data/gravesandglory/adoption-dev/) after each battlefield is generated. Evidence in <run>/mapforge/.
if (project.hasProperty('mapForge')) {
 loom.runs.client.vmArg '-Dgravesandglory.mapforge=true'
 loom.runs.client.vmArg "-Dgravesandglory.mapForgeScript=${file(project.property('mapForge')).absolutePath}"
}
if (project.hasProperty('adoptionDev')) { loom.runs.client.vmArg '-Dgravesandglory.adoptionDev=true' }
// The builder server's /mapforge commands, never in the player JAR: run the builder with
// -Dgg.build=<world> -Dfabric.addMods=build/mapforgeBuilder/mapforge-builder-DO-NOT-SHIP.jar
tasks.register('mapforgeBuilderJar', Jar) {
 dependsOn compileLocalTestTools
 from('build/localTestTools/classes') { include 'gg/gravesandglory/MapForge*.class', 'gg/gravesandglory/Walkability*.class' }
 from('test-tools/mapforge-builder')
 archiveFileName = 'mapforge-builder-DO-NOT-SHIP.jar'
 destinationDirectory = file('build/mapforgeBuilder')
}

// A/B harness: build the battlefields without MapDressing, to compare checks against the bare map.
if (project.hasProperty('noDressing')) { loom.runs.client.vmArg '-Dgravesandglory.noDressing=true' }
// Route checks: host a world by itself so evidence/control.json {"action":"routes"} can run unattended.
if (project.hasProperty('autoHost')) { loom.runs.client.vmArg '-Dgravesandglory.autoHost=true' }
// Map engine Plan 2: -PengineMap=<dir with map.json> [-PengineMapSlot=1] plays an engine build in one map slot (this JVM only; default slot 1, Ironhold).
if (project.hasProperty('engineMap')) {
 ['server', 'client'].each { r ->
  loom.runs.getByName(r).vmArg "-Dgravesandglory.engineMap=${file(project.property('engineMap')).absolutePath}"
  if (project.hasProperty('engineMapSlot')) loom.runs.getByName(r).vmArg "-Dgravesandglory.engineMapSlot=${project.property('engineMapSlot')}"
 }
}

// Plain clients (port plan P3): -PplainClients runs the dedicated server with Polymer and admits clients without the modpack
// (-Dgravesandglory.plainClients=true; off by default, so a modpack-only server refuses them as before). The Polymer-built pack
// (plain-pack.zip in the server root) is served by PropPack's HTTP server and is required. -PplainProbe adds the unshipped test commands.
if (project.hasProperty('plainClients')) {
 loom.runs.server.vmArg '-Dgravesandglory.plainClients=true'
 loom.runs.server.vmArg '-Dgg.propPack.file=plain-pack.zip'
 loom.runs.server.vmArg "-Dgg.propPack.port=${project.findProperty('plainPackPort') ?: '25692'}"
 loom.runs.server.vmArg '-Dgg.propPack.required=true'
 loom.runs.server.vmArg '-Dgg.propPack.plainOnly=true'
}
if (project.hasProperty('plainProbe')) {
 loom.runs.server.vmArg '-Dgravesandglory.localIntegration=true'
 loom.runs.server.vmArg "-Dfabric.addMods=${file('build/localTestTools/local-integration-DO-NOT-SHIP.jar').absolutePath}"
 loom.runs.server.vmArg '-Dgravesandglory.localChecks=local-checks.txt'
 loom.runs.server.vmArg '-Dgravesandglory.plainProbe=true'
 tasks.named('runServer') { dependsOn localTestToolsJar }
}
