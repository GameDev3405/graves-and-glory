/* War Table recruit, fourth pass. The same table and rail as home at the new density: the House cloths
   woven, the rod in six tones, the twine twisted, the seals in relief. Every portrait is the live model as
   the unit identity spec frames it (yaw 30, chest-up, 20 model px): 2 px per model px on the roll, 8 on the
   reveal, so the reveal shows the skin as the game will. Read left to right: the roll you have, the letter
   you just opened (the one bright object), the letters still sealed. The right column is one ladder on one
   axis (x 784), 12 px between rungs: the letters, Enlist right under them, the purse it spends, the Epic
   count, the Odds. Three columns share one top (124) and one bottom (492). */

.plq .ic{left:8px;top:7px}
.plq .h11{position:absolute;left:28px;top:8px}
.bnr{position:absolute;top:13px;width:104px;height:50px}
.bnr.on{height:60px}
.bnr .h11{top:27px}
.rw{position:absolute;left:0;width:240px;height:56px}
.rw .h11{position:absolute;left:60px;top:12px}
.rw .st{top:30px}
