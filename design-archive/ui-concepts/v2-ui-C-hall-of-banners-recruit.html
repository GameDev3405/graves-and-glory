<!doctype html>
<html class="v2"><head><meta charset="utf-8"><title>v2 UI C: Hall of Banners, recruit</title>
<link rel="stylesheet" href="common.css">
<style>
/* Hall of Banners recruit, second pass. The chosen House unfurls in the middle of the hall and carries the
   recruit it just gave you; the House's troops hang on the left as shields, the purse sits on the right. */
.beam{left:168px;top:12px;width:624px;height:6px;background:#4a3221;box-shadow:inset 0 1px 0 #6b4a30,inset 0 -1px 0 #2a1b10,0 2px 0 rgba(0,0,0,.4)}
.tab{position:absolute;top:18px;width:112px;height:28px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.tab>.pt{position:absolute;height:2px;background:inherit}
.tab .px{position:absolute;left:10px;top:11px}
.tab .h11{position:absolute;left:24px;top:9px}
.tab.on{height:32px}
.pole{left:344px;top:76px;width:272px;height:3px;background:var(--brass);box-shadow:0 1px 0 #6e5226}
.fin{position:absolute;top:74px;width:5px;height:7px;background:var(--brass-hi);box-shadow:inset -1px -1px 0 #8c7246,0 1px 0 #2a1b10}
.unf{left:360px;top:79px;width:240px;height:336px;background:#d8b45a;color:#2a2219;box-shadow:inset 0 0 0 1px #6e5226,inset 0 0 0 6px #d8b45a,inset 0 0 0 7px #a8842f,0 3px 0 rgba(0,0,0,.35)}
.frg{position:absolute;left:4px;top:336px;width:232px;height:10px;background:linear-gradient(180deg,transparent 0 8px,rgba(0,0,0,.25) 8px 10px),repeating-linear-gradient(90deg,#d8b45a 0 2px,transparent 2px 4px)}
.pf{position:absolute;left:48px;top:48px;width:144px;height:144px;background:#5a4214;box-shadow:inset 0 0 0 1px #2a2219,inset 0 0 28px rgba(0,0,0,.45)}
.sh{position:absolute;width:112px;height:112px}
.sh .nm{position:absolute;top:84px;left:0;width:112px;text-align:center}
.sh .rs{position:absolute;top:102px;left:42px;width:27px;height:6px}
.enlist{left:664px;top:232px;width:240px;height:40px;background:#bb9858;box-shadow:inset 0 0 0 1px var(--brass-hi),inset 0 -3px 0 #8c7246,0 3px 0 rgba(0,0,0,.5);color:#171d20}
</style></head>
<body>
<div class="scrim" data-bleed></div>

<!-- the five Houses hang from the hall's beam; the chosen one is lit -->
<div class="a beam" data-name="beam"></div>
<div class="tab on" data-ctl data-name="tab Gilded" style="left:180px;background:#d8b45a"><i class="pt" style="left:8px;top:32px;width:96px"></i><i class="pt" style="left:24px;top:34px;width:64px"></i><i class="pt" style="left:40px;top:36px;width:32px"></i><i class="px" data-art="gilded" data-pal="i=#4a3412"></i><span class="h11" style="color:#2a2219">Gilded Order</span></div>
<div class="tab" data-ctl data-name="tab Graveborn" style="left:300px;background:#3e5240"><i class="pt" style="left:8px;top:28px;width:96px"></i><i class="pt" style="left:24px;top:30px;width:64px"></i><i class="pt" style="left:40px;top:32px;width:32px"></i><i class="px" data-art="graveborn" data-pal="i=#d8d2c0"></i><span class="h11" style="color:#eee9df">Graveborn</span></div>
<div class="tab" data-ctl data-name="tab Wildmoot" style="left:420px;background:#6e3a1f"><i class="pt" style="left:8px;top:28px;width:96px"></i><i class="pt" style="left:24px;top:30px;width:64px"></i><i class="pt" style="left:40px;top:32px;width:32px"></i><i class="px" data-art="wildmoot" data-pal="i=#eccb8a"></i><span class="h11" style="color:#eee9df">Wildmoot</span></div>
<div class="tab" data-ctl data-name="tab Ironclad" style="left:540px;background:#4a5257"><i class="pt" style="left:8px;top:28px;width:96px"></i><i class="pt" style="left:24px;top:30px;width:64px"></i><i class="pt" style="left:40px;top:32px;width:32px"></i><i class="px" data-art="ironclad" data-pal="i=#e0c28a"></i><span class="h11" style="color:#eee9df">Ironclad</span></div>
<div class="tab" data-ctl data-name="tab Tidecallers" style="left:660px;background:#2b4f73"><i class="pt" style="left:8px;top:28px;width:96px"></i><i class="pt" style="left:24px;top:30px;width:64px"></i><i class="pt" style="left:40px;top:32px;width:32px"></i><i class="px" data-art="tidecallers" data-pal="i=#bfe6e0"></i><span class="h11" style="color:#eee9df">Tidecallers</span></div>
<div class="btns flex" data-ctl data-name="back" style="left:24px;top:16px;height:24px;padding:0 8px;gap:6px"><span class="key"><mc-text color="#afb9bc">Esc</mc-text></span><span class="h11">Hall</span></div>
<div class="btns flex" data-ctl data-name="banner" data-rx="936" style="top:16px;height:24px;padding:0 8px;gap:6px"><span class="key"><mc-text color="#afb9bc">B</mc-text></span><span class="h11">Banner</span></div>

<!-- the House's troops as shields: portrait, name, stars -->
<div id="roll"></div>

<!-- the chosen House unfurled, carrying the recruit it just gave: the one bright surface -->
<div class="a pole" data-name="pole"></div><i class="fin" style="left:340px"></i><i class="fin" style="left:615px"></i>
<div class="a unf" data-panel data-name="reveal banner">
  <i class="frg"></i>
  <i class="px a" data-art="gilded" data-scale="3" data-pal="i=#6e5226" style="left:108px;top:16px"></i>
  <div class="pf"><i class="px a" data-art="p_templar" data-scale="8" style="left:8px;top:8px"></i></div>
  <span class="a t16" data-cx="120" style="top:208px">Templar</span>
  <span class="a b11 nw" data-cx="120" style="top:230px;color:#4a3412">Rare infantry</span>
  <div class="a" data-cx="120" style="top:254px;width:62px;height:22px" data-name="stars">
    <i class="px a" data-art="star" data-scale="2" data-pal="i=#4a3412" style="left:0;top:5px"></i>
    <i class="px a" data-art="spark" data-scale="2" data-pal="i=#fbf4e2" style="left:22px;top:0"></i>
    <i class="px a" data-art="star" data-scale="2" data-pal="i=#fbf4e2" style="left:26px;top:5px"></i>
    <i class="px a" data-art="dot3" data-scale="2" data-pal="i=#8a6a2a" style="left:56px;top:8px"></i>
  </div>
  <span class="a b11 nw" data-cx="120" style="top:296px">Second star: +3% health and damage</span>
</div>

<!-- the purse and the one primary action -->
<div class="a flex" data-cx="784" style="top:204px;gap:6px" data-name="gold"><i class="px" data-art="coin" data-scale="2"></i><mc-text color="#eee9df" shadow>300</mc-text></div>
<div class="a enlist" data-ctl data-name="enlist">
  <span class="a key" style="left:8px;top:13px"><mc-text color="#2a2219">Enter</mc-text></span>
  <span class="a h11" data-cx="120" style="top:14px">Enlist</span>
  <span class="a flex" data-rx="232" style="top:16px;gap:4px"><i class="px" data-art="coin" data-pal="b=#6e5226,i=#f0d9a0"></i><mc-text color="#171d20">100</mc-text></span>
</div>
<span class="a b11 nw" data-cx="784" style="top:284px;color:#afb9bc">Epic within 28 letters</span>
<div class="btns flex" data-ctl data-name="odds" data-cx="784" style="top:308px;height:24px;padding:0 8px"><span class="h11">Odds</span></div>

<script>
/* heater shields from stepped rows (same builder as the Hall home): dark edge, rim, face */
function shield(el,o){
  const w=o.w,body=o.body,n=o.pt/2,rows=[[0,body,0,w]];
  for(let i=0;i<n;i++){const t=(i+1)/n;const hw=Math.max(2,Math.round((w/2)*Math.pow(1-t,0.75)));rows.push([body+i*2,2,Math.round(w/2-hw),hw*2]);}
  const g=document.createElement('div');g.setAttribute('data-under-ok','');g.style.cssText='position:absolute;left:24px;top:0';
  const lay=(c,d)=>rows.forEach(([y,h,x,ww])=>{const b=document.createElement('b');b.style.cssText=`position:absolute;left:${x-d}px;top:${y-d}px;width:${ww+2*d}px;height:${h+2*d}px;background:${c}`;g.appendChild(b);});
  lay('#0d1113',2);lay(o.rim,1);lay(o.face,0);el.appendChild(g);
}
const troops=[
  ['p_squire','Order Squire',2,0],['p_archer','Order Archer',1,0],
  ['p_templar','Templar',2,1],['p_longbow','Order Longbow',1,0],
  ['p_sunweaver','Sunweaver',0,2],['p_marshal','Lord Marshal Aldric',-1,3]];
let html='';
troops.forEach(([art,name,stars,state],i)=>{
  const x=64+(i%2)*128,y=104+Math.floor(i/2)*124;
  const dim=state>=2;
  let st='';
  if(stars>=0){for(let k=0;k<3;k++)st+=k<stars?`<i class="px a" data-art="star" data-pal="i=#c8a56b" style="left:${k*10}px"></i>`:`<i class="px a" data-art="dot3" data-pal="i=#5a6468" style="left:${k*10+2}px;top:1px"></i>`;}
  html+=`<div class="sh" data-ctl data-name="${name}" style="left:${x}px;top:${y}px" id="sh${i}">`+
    `<i class="px a" data-art="${art}" data-scale="2" ${dim?'data-sil="#3a464b"':''} style="left:40px;top:12px;z-index:1"></i>`+
    (state===3?`<i class="px a" data-art="lock" data-scale="2" data-pal="i=#afb9bc" style="left:50px;top:24px;z-index:2"></i>`:'')+
    `<span class="nm h11" style="color:${dim?'#afb9bc':'#eee9df'}">${name}</span>`+(stars>=0?`<span class="rs a">${st}</span>`:'')+`</div>`;
});
document.getElementById('roll').innerHTML=html;
troops.forEach(([art,name,stars,state],i)=>shield(document.getElementById('sh'+i),{w:64,body:56,pt:20,rim:state===1?'#c8a56b':'#4c5459',face:state===1?'#3a3424':'#232c30'}));
</script>
<script src="mc.js"></script><script src="art.js"></script><script src="v2.js"></script><script src="check.js"></script>
</body></html>
