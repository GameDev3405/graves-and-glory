<!doctype html>
<html class="v2"><head><meta charset="utf-8"><title>v2 UI C: Hall of Banners, home</title>
<link rel="stylesheet" href="common.css">
<style>
/* Hall of Banners home, second pass. Who rides (party banners, left), what you fight (three shields on the
   wall, centre, the chosen one lit), where (the field banner, right), then one button. */
.beam{left:168px;top:12px;width:624px;height:6px;background:#4a3221;box-shadow:inset 0 1px 0 #6b4a30,inset 0 -1px 0 #2a1b10,0 2px 0 rgba(0,0,0,.4)}
.pen{position:absolute;top:18px;width:112px;height:26px;background:#232c30;box-shadow:inset 0 0 0 1px #0d1113,inset 0 1px 0 #3b474c}
.pen>.pt{position:absolute;height:2px;background:#232c30}
.pen .px{position:absolute;left:10px;top:9px}
.pen .h11{position:absolute;left:24px;top:7px}
.pen mc-text{position:absolute;top:9px}
.rod{position:absolute;height:3px;background:#6b4a30;box-shadow:0 1px 0 #2a1b10}
.flag{position:absolute;width:48px;height:76px}
.flag>.pt{position:absolute;height:2px;background:inherit}
.sh{position:absolute}
.lbl{position:absolute;left:0;text-align:center}
.ride{left:360px;top:376px;width:240px;height:36px;background:#bb9858;box-shadow:inset 0 0 0 1px var(--brass-hi),inset 0 -3px 0 #8c7246,0 3px 0 rgba(0,0,0,.5);color:#171d20}
.field{left:736px;top:140px;width:168px;height:176px;background:#24323a;box-shadow:inset 0 0 0 1px #0d1113,inset 0 1px 0 #3d5260}
.field>.pt{position:absolute;height:2px;background:#24323a}
</style></head>
<body>
<div class="scrim" data-bleed></div>

<!-- the beam: the rest of the camp, one click away, counts as badges -->
<div class="a beam" data-name="beam"></div>
<div class="pen" data-ctl style="left:180px"><i class="pt" style="left:8px;top:26px;width:96px"></i><i class="pt" style="left:24px;top:28px;width:64px"></i><i class="pt" style="left:40px;top:30px;width:32px"></i><i class="px" data-art="letter" data-pal="p=#afb9bc,k=#232c30"></i><span class="h11">Recruit</span></div>
<div class="pen" data-ctl style="left:300px"><i class="pt" style="left:8px;top:26px;width:96px"></i><i class="pt" style="left:24px;top:28px;width:64px"></i><i class="pt" style="left:40px;top:30px;width:32px"></i><i class="px" data-art="pennant" data-pal="i=#afb9bc,k=#afb9bc"></i><span class="h11">Banner</span></div>
<div class="pen" data-ctl style="left:420px"><i class="pt" style="left:8px;top:26px;width:96px"></i><i class="pt" style="left:24px;top:28px;width:64px"></i><i class="pt" style="left:40px;top:30px;width:32px"></i><i class="px" data-art="seal" data-pal="b=#afb9bc,i=#232c30"></i><span class="h11">Contracts</span><mc-text data-rx="104" color="#c8a56b">2</mc-text></div>
<div class="pen" data-ctl style="left:540px"><i class="pt" style="left:8px;top:26px;width:96px"></i><i class="pt" style="left:24px;top:28px;width:64px"></i><i class="pt" style="left:40px;top:30px;width:32px"></i><i class="px" data-art="star" data-pal="i=#afb9bc"></i><span class="h11">Chapter</span></div>
<div class="pen" data-ctl style="left:660px"><i class="pt" style="left:8px;top:26px;width:96px"></i><i class="pt" style="left:24px;top:28px;width:64px"></i><i class="pt" style="left:40px;top:30px;width:32px"></i><i class="px" data-art="friend" data-pal="i=#afb9bc"></i><span class="h11">Friends</span><mc-text data-rx="104" color="#c8a56b">1</mc-text></div>
<div class="btns flex" data-ctl data-name="close" style="left:24px;top:16px;height:24px;padding:0 8px;gap:6px"><span class="key"><mc-text color="#afb9bc">Esc</mc-text></span><span class="h11">Camp</span></div>

<!-- who rides: the party's banners on a short rod -->
<span class="a h11" style="left:56px;top:140px;color:#c8a56b">Party</span>
<div class="rod" style="left:56px;top:160px;width:176px"></div>
<div class="flag" data-ctl data-name="you" style="left:64px;top:163px;background:#2e6b68;box-shadow:inset 0 0 0 1px #0d1113"><i class="pt" style="left:4px;top:76px;width:40px"></i><i class="pt" style="left:12px;top:78px;width:24px"></i><i class="pt" style="left:20px;top:80px;width:8px"></i>
  <i class="px a" data-art="sun" data-scale="2" data-pal="i=#eee9df" style="left:17px;top:12px"></i><span class="a h11" data-cx="24" style="top:38px">Kort</span><i class="px a" data-art="check" data-scale="2" data-pal="i=#eee9df" style="left:19px;top:56px"></i></div>
<div class="flag" data-ctl data-name="friend" style="left:120px;top:163px;background:#2e6b68;box-shadow:inset 0 0 0 1px #0d1113"><i class="pt" style="left:4px;top:76px;width:40px"></i><i class="pt" style="left:12px;top:78px;width:24px"></i><i class="pt" style="left:20px;top:80px;width:8px"></i>
  <i class="px a" data-art="sun" data-scale="2" data-pal="i=#eee9df" style="left:17px;top:12px"></i><span class="a h11" data-cx="24" style="top:38px">Ansel</span><i class="px a" data-art="check" data-scale="2" data-pal="i=#eee9df" style="left:19px;top:56px"></i></div>
<div class="flag" data-ctl data-name="invite" style="left:176px;top:163px;box-shadow:inset 0 0 0 1px #5a6468">
  <i class="px a" data-art="cross" data-scale="2" data-pal="k=#afb9bc" style="left:17px;top:12px"></i><span class="a h11" data-cx="24" style="top:38px;color:#afb9bc">Invite</span></div>

<!-- what you fight: three shields on the wall; the chosen one is lit -->
<div class="sh" id="s-practice" data-ctl data-name="practice" style="left:248px;top:160px;width:128px;height:160px"></div>
<div class="sh" id="s-skirmish" data-ctl data-name="skirmish" style="left:400px;top:140px;width:160px;height:200px"></div>
<div class="sh" id="s-campaign" data-ctl data-name="campaign" style="left:584px;top:160px;width:128px;height:160px"></div>

<!-- where: the field banner -->
<div class="a field" data-panel data-name="field"><i class="pt" style="left:8px;top:176px;width:152px"></i><i class="pt" style="left:24px;top:178px;width:120px"></i><i class="pt" style="left:48px;top:180px;width:72px"></i>
  <i class="px a" data-art="wave" data-scale="3" data-pal="s=#9cc7c9" style="left:72px;top:20px"></i>
  <span class="a h11" data-cx="84" style="top:48px">Rivergate Valley</span>
  <span class="a b11 nw" data-cx="84" style="top:72px;color:#afb9bc">Domination to 300</span>
  <span class="a b11 nw" data-cx="84" style="top:88px;color:#afb9bc">2 v 2, Normal bots</span>
  <div class="a" style="left:52px;top:116px;width:64px;height:1px;background:#3d5260"></div>
  <div class="btns flex" data-ctl data-name="change field" data-cx="84" style="top:132px;height:24px;padding:0 8px"><span class="h11">Change</span></div>
</div>

<!-- the one primary action -->
<div class="a ride" data-ctl data-name="ride">
  <span class="a key" style="left:8px;top:11px"><mc-text color="#2a2219">Enter</mc-text></span>
  <span class="a h11" data-cx="120" style="top:12px">Ride to the war gates</span>
</div>

<script>
/* heater shields from stepped rows: a dark rim layer, then the face 1 px inside it */
function shield(id,o){
  const el=document.getElementById(id),w=o.w,body=o.body,n=o.pt/2,rows=[[0,body,0,w]];
  for(let i=0;i<n;i++){const t=(i+1)/n;const hw=Math.max(2,Math.round((w/2)*Math.pow(1-t,0.75)));rows.push([body+i*2,2,Math.round(w/2-hw),hw*2]);}
  const g=document.createElement('div');g.setAttribute('data-under-ok','');g.style.cssText='position:absolute;left:0;top:0';
  const lay=(c,d)=>rows.forEach(([y,h,x,ww])=>{const b=document.createElement('b');b.style.cssText=`position:absolute;left:${x-d}px;top:${y-d}px;width:${ww+2*d}px;height:${h+2*d}px;background:${c}`;g.appendChild(b);});
  lay(o.edge,2);lay(o.rim,1);lay(o.face,0);
  if(o.hi){const b=document.createElement('b');b.style.cssText=`position:absolute;left:0;top:0;width:${w}px;height:2px;background:${o.hi}`;g.appendChild(b);}
  el.appendChild(g);
  const sc=o.sc||4;el.insertAdjacentHTML('beforeend',`<i class="px a" data-art="${o.art}" data-scale="${sc}" data-pal="${o.pal}" style="left:${w/2-4*sc}px;top:${o.gy}px"></i>`+o.label);
}
shield('s-practice',{w:128,body:120,pt:40,edge:'#0d1113',rim:'#4c5459',face:'#2c3438',art:'dummy',pal:'i=#afb9bc,b=#8c7246',gy:28,label:'<span class="lbl h11" style="width:128px;top:80px;color:#afb9bc">Practice</span>'});
shield('s-skirmish',{w:160,body:152,pt:48,edge:'#0d1113',rim:'#c8a56b',face:'#e6d9b8',hi:'#f3ead2',art:'swords',pal:'i=#2a2219',gy:36,sc:5,label:'<span class="lbl t16" style="width:160px;top:96px;color:#2a2219">Skirmish</span>'});
shield('s-campaign',{w:128,body:120,pt:40,edge:'#0d1113',rim:'#4c5459',face:'#2c3438',art:'keep',pal:'k=#afb9bc,i=#afb9bc',gy:28,label:'<span class="lbl h11" style="width:128px;top:80px;color:#afb9bc">Campaign</span>'});
</script>
<script src="mc.js"></script><script src="art.js"></script><script src="v2.js"></script><script src="check.js"></script>
</body></html>
